<!DOCTYPE html>
<html>
<head>
    <title>Billing System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"] {
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;
        }
        .product-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
        .product-row input { flex: 1; }
        .denomination-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .denomination-row label { width: 50px; margin: 0; }
        .denomination-row input { width: 100px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .section h3 { margin-top: 0; }
        .separator { border-top: 2px solid #333; margin: 20px 0; }
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Billing System</h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="section">
                <h3>Customer Information</h3>
                <div class="form-group">
                    <label for="customer_email">Customer Email:</label>
                    <input type="email" id="customer_email" name="customer_email" required>
                </div>
            </div>
            
            <div class="section">
                <h3>Bill Section</h3>
                <div id="product-rows">
                    <div class="product-row">
                        <div>
                            <label>Product ID:</label>
                            <input type="text" name="product_id_0" placeholder="Enter Product ID" required>
                        </div>
                        <div>
                            <label>Quantity:</label>
                            <input type="number" name="quantity_0" min="1" value="1" required>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" onclick="addProductRow()">Add New</button>
            </div>
            
            <div class="separator"></div>
            
            <div class="section">
                <h3>Denominations</h3>
                {% for denom in denominations %}
                <div class="denomination-row">
                    <label>{{ denom }}:</label>
                    <input type="number" name="denom_{{ denom }}" min="0" value="0">
                </div>
                {% endfor %}
            </div>
            
            <div class="section">
                <h3>Payment</h3>
                <div class="form-group">
                    <label for="cash_paid">Cash paid by customer:</label>
                    <input type="number" id="cash_paid" name="cash_paid" step="0.01" min="0" required>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-success">Generate Bill</button>
                <a href="{% url 'customer_history' %}" class="btn btn-primary">View Customer History</a>
            </div>
        </form>
    </div>
    
    <script>
        let productRowCount = 1;
        
        function addProductRow() {
            const container = document.getElementById('product-rows');
            const newRow = document.createElement('div');
            newRow.className = 'product-row';
            newRow.innerHTML = `
                <div>
                    <label>Product ID:</label>
                    <input type="text" name="product_id_${productRowCount}" placeholder="Enter Product ID" required>
                </div>
                <div>
                    <label>Quantity:</label>
                    <input type="number" name="quantity_${productRowCount}" min="1" value="1" required>
                </div>
            `;
            container.appendChild(newRow);
            productRowCount++;
        }
    </script>
</body>
</html>
